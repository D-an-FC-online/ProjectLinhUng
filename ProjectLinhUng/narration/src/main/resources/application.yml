
spring:
  application:
    name: narration-api

  datasource:
    url: "jdbc:sqlserver://localhost:1433;databaseName=LinhUngGuide;encrypt=true;trustServerCertificate=true"
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: 8080
