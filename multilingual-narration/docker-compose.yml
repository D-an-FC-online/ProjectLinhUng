# =====================================================================
# Docker Compose CHỈ dùng để chạy MySQL 8 cho môi trường phát triển.
# (Đóng gói ứng dụng thành Docker image + GitHub Actions là phần việc của
#  thành viên phụ trách CI/CD — xem docs/INTEGRATION.md.)
#
# Cách dùng:
#   1. cp .env.example .env    (rồi điền mật khẩu vào .env)
#   2. docker compose up -d
#   3. docker compose ps       (đợi trạng thái "healthy")
# =====================================================================
services:
  mysql:
    image: mysql:8.4
    container_name: narration-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-multilingual_narration}
      MYSQL_USER: ${DB_USERNAME:-narration_app}
      # Dấu ":?" => docker compose báo lỗi nếu chưa khai báo biến trong file .env
      MYSQL_PASSWORD: ${DB_PASSWORD:?Hay khai bao DB_PASSWORD trong file .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Hay khai bao MYSQL_ROOT_PASSWORD trong file .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - narration-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  narration-mysql-data:
