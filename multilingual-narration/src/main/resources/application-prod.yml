# =====================================================================
# Profile PROD — dùng khi triển khai (Docker / server)
# Kích hoạt bằng biến môi trường: SPRING_PROFILES_ACTIVE=prod
#
# Khác với dev: KHÔNG có giá trị mặc định cho thông tin DB.
# Thiếu biến môi trường => ứng dụng dừng ngay khi khởi động (fail fast),
# tránh trường hợp chạy nhầm vào database sai.
# =====================================================================
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=${DB_USE_SSL:false}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

logging:
  level:
    root: INFO
    com.example.multilingualnarration: INFO

springdoc:
  swagger-ui:
    # Có thể tắt Swagger UI trên môi trường thật bằng SWAGGER_ENABLED=false
    enabled: ${SWAGGER_ENABLED:true}
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
