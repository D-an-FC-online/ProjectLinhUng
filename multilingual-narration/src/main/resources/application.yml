# =====================================================================
# Cấu hình mặc định (dùng chung cho mọi môi trường)
# Thông tin nhạy cảm (user/password DB) đọc từ BIẾN MÔI TRƯỜNG, không hardcode.
# Cú pháp ${TEN_BIEN:gia_tri_mac_dinh} => nếu không có biến môi trường thì dùng giá trị mặc định.
# =====================================================================
spring:
  application:
    name: multilingual-narration

  profiles:
    # Mặc định chạy profile "dev". Khi triển khai đặt SPRING_PROFILES_ACTIVE=prod
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:multilingual_narration}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:narration_app}
    # Không có giá trị mặc định thật: phải đặt biến môi trường DB_PASSWORD
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    # Flyway là "nguồn sự thật" của schema => Hibernate KHÔNG được tự tạo/sửa bảng.
    # (Integration test bật "validate" để kiểm tra Entity khớp với schema.)
    hibernate:
      ddl-auto: none
    # Tắt Open Session In View: mọi truy cập dữ liệu phải nằm trong tầng Service (@Transactional),
    # tránh việc Controller vô tình kích hoạt lazy loading => truy vấn N+1 khó phát hiện.
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  error:
    # Không bao giờ trả stack trace / thông điệp exception nội bộ cho client
    include-stacktrace: never
    include-message: never

# ----- Actuator: dùng cho health check của Docker / CI/CD -----
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true       # bật /actuator/health/liveness và /actuator/health/readiness
      show-details: never

# ----- Swagger / OpenAPI -----
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# ----- Cấu hình riêng của ứng dụng -----
app:
  cors:
    # Danh sách origin của Frontend được phép gọi API, ngăn cách bằng dấu phẩy
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
