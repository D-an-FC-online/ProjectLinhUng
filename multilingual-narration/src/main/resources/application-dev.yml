# =====================================================================
# Profile DEV — chạy trên máy cá nhân
# Kích hoạt mặc định (xem spring.profiles.active trong application.yml)
# =====================================================================
logging:
  level:
    com.example.multilingualnarration: DEBUG
    # In câu SQL ra console để quan sát (ví dụ: kiểm tra không bị N+1)
    org.hibernate.SQL: DEBUG

management:
  endpoint:
    health:
      # Ở máy dev cho xem chi tiết (trạng thái DB, dung lượng đĩa...)
      show-details: always
