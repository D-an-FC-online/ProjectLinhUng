services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: damsen-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "DamSen@StrongPassword123"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql

volumes:
  mssql-data:
